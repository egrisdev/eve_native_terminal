name: Build

# Every push and pull request: run the tests and build the installer.
# A tag like v1.2.0 also publishes the installer as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only to create the release on a tag
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ g++-mingw-w64-x86-64 wixl

      # A tag sets the version (v1.2.0 -> 1.2.0). Otherwise build.sh uses its default.
      - name: Test and build the installer
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./build.sh "${GITHUB_REF_NAME#v}"
          else
            ./build.sh
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: EVE-Windows-Terminal
          path: dist/*.msi
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.msi
          --title "EVE Windows Terminal ${GITHUB_REF_NAME#v}"
          --generate-notes
